# site properties and page defaults
title: Welcome to MALLARD's Home
subtitle: Vanderbilt University's Model AnaLytics Laboratory for Advanced tReatment Delivery
description: An engaging 1-3 sentence description of your lab.
header: images/Designer.png
footer: images/Designer.png
proofer: false

# site social media and other links
links:
  email: contact@jonheiselman.com
  orcid: 0000-0002-4414-8846
  google-scholar: s_DmWYkAAAAJ
  github: jonheiselman
  #twitter: jonheiselman
  #youtube: jonheiselman

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
